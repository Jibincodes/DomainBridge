function learningBridge(){return `${heading('The Missing Bridge: From Business Logic to SQL','Understand technical concepts through business problems you already recognize.')}${profile()}<div class="bridgegrid"><section class="card bridgepanel leftpanel"><div class="titlewithicon"><span class="iconbox">▥</span><div><h3>The problem you understand</h3><p>Business Perspective</p></div></div><p class="bodytext">A retailer wants to understand how much revenue each customer generated from their orders.</p><div class="entityflow"><div class="entitybox"><strong>Customers</strong><div style="font-size:20px;color:#2563eb">●</div><b>Alpine Retail AG</b><div class="fine">customer_id: 1</div></div><div class="entitybox orderbox"><strong>Orders</strong><span class="orderchip">Order 101<br><b>CHF 500</b></span><span class="orderchip">Order 102<br><b>CHF 300</b></span></div><div class="entitybox revbox"><strong>Revenue</strong><span class="price">CHF 800</span><span>Total for customer</span></div></div><p class="bodytext">From a business perspective, you already understand that customer revenue is calculated from the orders belonging to that customer.</p></section><section class="mapping"><button class="btn primary" data-action="translate">→ Translate Business Logic into SQL</button>${[['Business customer','Customers table'],['Customer order','Orders table'],['Revenue total','SUM(order_total)'],['Customer relationship','JOIN on customer_id']].map(([a,b])=>`<div class="mapping-item ${state.mapped?'revealed':''}"><b>${a}</b>${state.mapped?`<span class="arrow">↓</span> ${b}`:'Select Translate to reveal mapping'}</div>`).join('')}</section><section class="card bridgepanel rightpanel"><div class="titlewithicon"><span class="iconbox redbox">▤</span><div><h3>How technology represents it</h3><p>Technical Perspective</p></div></div><p class="bodytext">The same information is stored in related database tables, connected through a primary key and a foreign key.</p><div class="dbtables"><div class="dbtable"><div class="dbtitle">▤ Customers</div>${tableHtml(customers.slice(0,3),['customer_id','customer_name'])}</div><div class="dbtable orangeborder"><div class="dbtitle">▤ Orders</div>${tableHtml(orders.slice(0,4),['order_id','customer_id','order_total'])}</div></div><div class="dbtagrow"><span class="pill blue">🔑 Customers.customer_id · Primary key</span><span class="pill orange">🔑 Orders.customer_id · Foreign key</span><span class="pill red">1 → many</span></div><p class="fine" style="margin-top:11px">A customer can have many orders. Each order belongs to one customer in this example. The relationship uses matching customer_id values.</p></section></div><div class="queryshow"><article class="card codecard"><div class="sectiontitle" style="margin:0 0 8px"><h2>SQL translation</h2><span class="pill neutral">Read-only example</span></div><p class="fine">The same reporting question, expressed as a relational query.</p><pre class="sqlpretty">${syntaxHighlight(BRIDGE_SQL)}</pre><div class="annotations"><div class="annotation"><b>JOIN</b> links each order to the correct customer using customer_id.</div><div class="annotation"><b>SUM</b> adds the customer’s order amounts.</div><div class="annotation"><b>GROUP BY</b> creates one revenue total for each customer name in this example.</div></div></article><article class="card assist-card"><h3>Choose your learning perspective</h3><p class="bodytext">I can explain this through business processes, database structures, or SQL syntax. Choose the perspective that helps you most.</p><div class="assist-options">${[['business','Explain as a business problem'],['diagram','Explain as a database diagram'],['syntax','Explain using SQL'],['other','Show another example']].map(([v,n])=>`<button class="btn slim" data-action="bridge-help" data-value="${v}">${n} →</button>`).join('')}</div>${state.bridgeHelp?`<div class="helper">${esc({business:'Start with the reporting question: which orders belong to each customer? The table relationship makes that business rule explicit.',diagram:'The Customers table stores one row per customer. The Orders table stores many orders, each with a foreign key pointing back to a customer.',syntax:'JOIN matches customer_id across both tables; SUM aggregates the order totals; GROUP BY creates a per-customer result.',other:'A hotel could calculate revenue per guest by joining Guests and Bookings on guest_id. The business-to-database pattern is reusable.'}[state.bridgeHelp])}</div>`:''}</article></div><section class="card consequence"><div class="sectiontitle" style="margin:0"><h2>Show Me the Business Consequence</h2><button class="btn slim" data-action="consequence">${state.businessConsequence?'Hide comparison':'Show comparison'} →</button></div><p class="fine">A deliberately faulty relationship can misattribute or duplicate orders. It does not always double revenue.</p>${state.businessConsequence?`<div class="correctwrong"><div class="reportvalue"><b>✓ Correct customer-id relationship</b><strong style="color:#00815b">CHF 800</strong><span>Alpine Retail AG: 500 + 300</span></div><div class="reportvalue bad"><b>✕ Illustrative faulty join / duplicated rows</b><strong style="color:#c31a2c">CHF 1,600</strong><span>If the same two orders were mistakenly counted twice; an illustration, not the default region-join output.</span></div></div>`:''}<div class="btnrow" style="margin-top:12px">${linkbutton('Apply This to a New Problem','Workbench')}</div></section>`}
function evaluateSql(sql){
  const clean=sql.replace(/--[^\n]*/g,' ').replace(/\/\*[\s\S]*?\*\//g,' ').replace(/\s+/g,' ').trim();
  if(!/\bSELECT\b/i.test(clean)||!/\bFROM\s+Customers\s+(?:AS\s+)?c\b/i.test(clean)||!/\bJOIN\s+Orders\s+(?:AS\s+)?o\b/i.test(clean)||!/\bSUM\s*\(\s*o\.order_total\s*\)/i.test(clean)||!/\bGROUP\s+BY\s+c\.customer_name\b/i.test(clean))throw Error('This offline demonstration supports the provided SELECT / SUM / Customers JOIN Orders / GROUP BY reporting pattern. Keep those clauses and edit the ON relationship.');
  if(/\b(WHERE|HAVING|UNION|INTERSECT|EXCEPT|LIMIT|CROSS|ORDER\s+BY)\b/i.test(clean)||/\bON\b[^;]*\b(AND|OR)\b/i.test(clean))throw Error('The offline demo does not support extra clauses or compound JOIN conditions. Simplify the provided query and edit only the ON relationship.');
  const match=clean.match(/\bON\s+([co])\.([a-z_][\w]*)\s*=\s*([co])\.([a-z_][\w]*)/i);
  if(!match)throw Error('Add a supported JOIN condition: ON c.column = o.column.');
  const a=match[1].toLowerCase(),b=match[2].toLowerCase(),c=match[3].toLowerCase(),d=match[4].toLowerCase();
  if(a===c)throw Error('The JOIN condition must connect Customers and Orders.');
  const getC=a==='c'?b:d,getO=a==='o'?b:d;
  if(!['customer_id','customer_name','region'].includes(getC)||!['order_id','customer_id','order_total','sales_region'].includes(getO))throw Error('Unknown column in JOIN condition. Check the Customers and Orders sample tables.');
  const rows=customers.map(c=>{const matching=orders.filter(o=>String(c[getC])===String(o[getO]));return {customer_name:c.customer_name,total_revenue:matching.reduce((sum,o)=>sum+o.order_total,0),orders_count:matching.length}}).filter(r=>r.orders_count);
  return {rows,join:`c.${getC} = o.${getO}`,correct:getC==='customer_id'&&getO==='customer_id',expected:rows.length===4&&rows.every((r,i)=>r.total_revenue===[800,200,600,600][i])};
}

function stageDone(n){return state.labCompleted.includes(n)}
function practiceHeader(){return `<section class="card labhead"><div class="labtop"><div class="iconbox redbox" style="width:42px;height:42px">▣</div><div style="flex:1"><span class="pill red">SIMULATED PROFESSIONAL EXPERIENCE · FICTIONAL CLIENT</span><h2>Retail Sales Reporting Transformation</h2><p class="bodytext" style="margin:0">Alpine Retail Group — Fictional Client</p></div><span class="pill ${state.simulationDone?'green':'blue'}">${state.simulationDone?'Simulation completed':state.discoveryStarted||state.labCompleted.length?'Simulation in progress':'Ready to Begin'}</span></div><div class="labmeta"><span><b>Assigned role:</b> Junior Technology Consultant</span><span><b>Current stage:</b> ${esc(['Discovery','Data Investigation','Recommendation','Client Presentation'][state.labPhase])}</span><span><b>Experience:</b> Optional, AI-style scripted simulation</span></div><div class="proof"><b>Project objective:</b> The client has identified inconsistencies in its sales reporting. Your responsibility is to understand the reporting requirements, investigate the underlying data issues, and recommend an appropriate solution.</div>${state.labPhase===0&&!state.discoveryStarted?'<div class="btnrow" style="margin-top:12px"><button class="btn primary" data-action="start-discovery">Begin Client Discovery →</button></div>':''}</section>`}
function phaseNavigation(){return `<div class="phaseline">${labPhaseLabels.map((t,i)=>`<button class="phasebtn ${state.labPhase===i?'active':''} ${stageDone(i)?'done':''}" data-action="lab-phase" data-value="${i}"><span class="phnum">${stageDone(i)?'✓':i+1}</span><span><strong>Phase ${i+1} · ${esc(t)}</strong><small>${['Clarify needs with stakeholder','Inspect data and relationships','Document cause, fix and controls','Explain impact and trade-offs'][i]}</small></span></button>`).join('')}</div>`}
function chatRespond(q){const txt=q.toLowerCase();if(/customer|account|order|individual|level/.test(txt))return 'We need totals per customer based only on that customer’s orders. I would like to compare the new report with transaction records and know why mismatches occur.';if(/region|join|database|sql|relationship|key/.test(txt))return 'Our teams suspect that regional grouping may mix records across different customer accounts. Could you identify which order belongs to which customer and explain the risk to us?';if(/report|frequency|when|deadline/.test(txt))return 'Management uses monthly reports for decisions. The priority is confidence in the totals; this training scenario has no real contractual deadline.';if(/stakeholder|decision|success|accept|requirement/.test(txt))return 'A successful outcome would provide correct customer totals, a clear explanation of the root cause, and a practical validation control before reports are published.';if(/impact|risk|business/.test(txt))return 'Incorrect totals could distort account reviews and management decisions. Please keep your recommendation understandable to nontechnical colleagues.';return 'Thank you. Please help us clarify the reporting requirement, the affected data relationships, and how we can prevent recurring inaccuracies.'}
function scenarioResources(){return `<div class="resourcebtn">▤ Client reporting brief · Fictional</div><div class="resourcebtn">▤ Sample Customers / Orders tables · Fictional</div><div class="resourcebtn">▤ SQL relationship reference · Earlier learning</div><p class="fine">All information is simulated. No client, university, or personal records are transmitted.</p><div class="btnrow"><button class="btn slim" data-action="nav" data-value="Learning Bridge">Review SQL relationships ↗</button></div>`}
function phaseMain(){let p=state.labPhase;if(p===0){return `<div class="labgrid"><section class="card labpane"><div class="sectiontitle" style="margin:0 0 9px"><h3>Client project briefing</h3><span class="pill red">Phase 1 · Discovery</span></div><p class="bodytext">Alpine Retail Group has noticed inconsistent customer revenue totals in a management report. Your first responsibility is to clarify what the client expects before proposing technical changes.</p><div class="proof"><b>Client requirement to clarify</b><br/>What exactly is measured, how orders are attributed to customers, and what constitutes an acceptable correction?</div><hr class="smallrule"><label class="formlabel" for="discovery-notes">Discovery notes / initial understanding</label><textarea class="notearea" id="discovery-notes" data-field="discoveryNotes" placeholder="Record the business reporting requirement and questions you still need answered...">${esc(state.discoveryNotes)}</textarea><div class="btnrow" style="margin-top:10px"><button class="btn primary" data-action="save-discovery">Save discovery notes →</button></div></section><section class="card labpane"><h3>AI-simulated stakeholder</h3><div class="stakeholder"><span class="avatar">AK</span><div><strong>Anna Keller</strong><div class="fine">Head of Sales Operations · Fictional stakeholder</div></div></div><div class="speech">“Our management reports show inconsistent revenue totals. Before we change anything, I need to understand where the problem comes from.”</div><div class="chatlog" id="chatlog">${state.chat.map(row=>`<div class="chatbubble ${row.by==='Sameh'?'me':''}"><b>${esc(row.by)}</b><br>${esc(row.text)}</div>`).join('')}</div><label class="formlabel" for="chat-input" style="margin-top:10px">Ask Anna a discovery question</label><textarea class="notearea" id="chat-input" data-field="chatDraft" rows="2" style="min-height:63px" placeholder="For example: How should orders be assigned to customers?">${esc(state.chatDraft)}</textarea><div class="btnrow" style="margin-top:8px"><button class="btn primary slim" data-action="send-chat">Send question →</button><span class="fine">Offline scripted responses · not live AI</span></div></section><aside class="card labpane"><h3>Project resources</h3>${scenarioResources()}<hr class="smallrule"><h3>Your Academic Preparation for This Engagement</h3>${academicPrep()}</aside></div>`}
if(p===1)return `<div class="labgrid"><section class="card labpane"><h3>Investigate the Data</h3><p class="bodytext">Use the fictional customer and order records. The reporting team grouped orders by sales region rather than the unique customer identifier.</p><div class="dataset"><h4>Customers</h4>${tableHtml(customers,['customer_id','customer_name','region'])}</div><div class="dataset"><h4>Orders (sample)</h4>${tableHtml(orders,['order_id','customer_id','order_total','sales_region'])}</div><p class="fine">Correct totals: Alpine CHF 800 · Buchegger CHF 200 · Central CHF 600 · Deltatech CHF 600.</p></section><section class="card labpane"><h3>Document your root-cause investigation</h3><div class="proof">Consultant task: Explain which relationship is unreliable, how the error impacts the report, and which identifiers should be used.</div><label class="formlabel" style="margin-top:14px" for="data-findings">Investigation notes</label><textarea id="data-findings" class="notearea" data-field="dataFindings" style="min-height:162px" placeholder="The issue may come from...">${esc(state.dataFindings)}</textarea><div class="btnrow" style="margin-top:10px"><button class="btn primary" data-action="save-data">Save findings →</button></div></section><aside class="card labpane"><h3>Linked learning evidence</h3>${academicPrep()}<hr class="smallrule"><h3>Resources</h3>${scenarioResources()}</aside></div>`;
if(p===2)return `<div class="labgrid"><section class="card labpane"><h3>Prepare a consultant recommendation</h3><div class="proof">Your recommendation should cover the cause, a technical correction, and a preventive control. A convincing recommendation connects data reliability with a management decision.</div><label class="formlabel" style="margin-top:14px" for="rec-cause">1. Root cause</label><textarea id="rec-cause" data-field="recCause" class="notearea" placeholder="Why did the report attribute revenue incorrectly?">${esc(state.recCause)}</textarea><label class="formlabel" style="margin-top:12px" for="rec-fix">2. Proposed correction</label><textarea id="rec-fix" data-field="recFix" class="notearea" placeholder="How would you fix the join and validate it?">${esc(state.recFix)}</textarea><label class="formlabel" style="margin-top:12px" for="rec-control">3. Prevention control</label><textarea id="rec-control" data-field="recControl" class="notearea" placeholder="What repeatable checks would help prevent recurrence?">${esc(state.recControl)}</textarea><div class="btnrow" style="margin-top:10px"><button class="btn primary" data-action="save-rec">Save recommendation →</button></div></section><section class="card labpane"><h3>Decision context</h3><div class="speech">“I need a fix, but I also need to know how we can trust the numbers next month.”<br/><b>— Anna Keller (simulated)</b></div><p class="bodytext">Consider completeness, order attribution, reconciliation to source records, and communicating residual uncertainty.</p></section><aside class="card labpane"><h3>Project resources</h3>${scenarioResources()}${academicPrep()}</aside></div>`;
return `<div class="labgrid"><section class="card labpane"><h3>Present to the Client</h3><div class="stakeholder"><span class="avatar">AK</span><div><b>Anna Keller</b><div class="fine">Simulated client stakeholder</div></div></div><div class="speech">“Can you explain in business terms why the totals were wrong, how you would fix them, and how we will know the new report is accurate?”</div><label class="formlabel" for="presentation">Your client-facing presentation</label><textarea id="presentation" class="notearea" style="min-height:190px" data-field="presentation" placeholder="The original report was unreliable because... Our recommendation is...">${esc(state.presentation)}</textarea><div class="btnrow" style="margin-top:11px"><button class="btn primary" data-action="complete-lab">Complete simulated engagement →</button></div></section><section class="card labpane"><h3>Review engagement artifacts</h3><div class="detailrow"><strong>Discovery notes</strong>${esc(state.discoveryNotes||'Not saved yet')}</div><div class="detailrow"><strong>Investigation</strong>${esc(state.dataFindings||'Not saved yet')}</div><div class="detailrow"><strong>Recommendation</strong>${esc(state.recFix||'Not saved yet')}</div>${state.simulationDone?`<div class="helper" style="background:#eefbf5;border-color:#cdebd9">Simulated engagement completed. Deliverables were recorded; professional job-readiness has not been assessed.</div><button class="btn bluebtn" data-action="portfolio" style="margin-top:10px">↓ Export simulated portfolio</button>`:''}</section><aside class="card labpane"><h3>Evidence and disclosure</h3><p class="bodytext">Simulated deliverables may inform the competency record and be exported with a clear <b>SIMULATED EXPERIENCE</b> label. Real client work or independently verified professional performance is not claimed.</p>${academicPrep()}</aside></div>`
}
function academicPrep(){return `<div class="resourcelist"><ul><li><b>Business requirements interpretation</b> — relevant background</li><li><b>SQL and data relationships</b> — ${state.workRun?'recent learning activity':'curriculum-linked topic'}</li><li><b>Data validation</b> — developing evidence</li><li><b>Stakeholder communication</b> — further practice opportunity</li></ul><p class="fine">This engagement builds on Database Management and explores broader consulting responsibilities.</p></div>`}
function practiceLab(){return `${heading('Practice Lab — Technology Consulting','Experience professional responsibilities before taking them on in the real world.')}${profile()}${practiceHeader()}${phaseNavigation()}${phaseMain()}<section class="card labfoot"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><span><b>After the simulation:</b> Project deliverables and observable actions can inform your evidence record. Portfolio exports remain explicitly labelled <b>simulated experience</b>.</span><div class="btnrow"><button class="btn slim" data-action="lab-reset">Reset simulation</button><button class="btn slim bluebtn" data-action="nav" data-value="Competency Evidence">View Competency Evidence →</button></div></div><details class="help"><summary>Need support? &nbsp;▾</summary>${[['sql','Review SQL relationships'],['stakeholder','Understand stakeholder requirements'],['recommend','Structure a client recommendation']].map(([v,label])=>`<button class="resourcebtn" data-action="lab-help" data-value="${v}">${label} →</button>`).join('')}${state.labHelp?`<div class="helpdetail">${esc({sql:'Check whether Orders.customer_id matches Customers.customer_id; refer to the earlier Learning Bridge for a visual example.',stakeholder:'Clarify who uses the report, what totals are expected, the reporting period, and how a correct result would be verified.',recommend:'Present your recommendation as issue → business impact → correction → verification control → residual risks.'}[state.labHelp])}</div>`:''}</details></section>`}
function settings(){return `${heading('Settings & Data Transparency','Control which local demonstration inputs are shown and how your activity record is kept.')}${profile()}<div class="grid2"><section class="card minicard"><h3>Your learning context</h3><p>University: FHNW School of Business (illustrative connection only)</p><p>Programme: MSc Business Information Systems</p><p>Semester: Autumn 2026</p><p>Previous academic background: Business Administration (persona description)</p><p>Career interest is student-editable above; it is not independently verified.</p><div class="helper">Curriculum requirements and student records are simulated for this prototype. No real FHNW login or live integration is performed.</div></section><section class="card minicard"><h3>Local data and permissions</h3><p>This offline application stores editable career preference and learning interaction records in this browser's local storage when supported. It sends no data to a server.</p><div class="btnrow"><button class="btn bluebtn" data-action="export-evidence">↓ Export current evidence as JSON</button><button class="btn" data-action="reset-all">Reset all demo activity</button></div><hr class="smallrule"><h3>Evidence limitations</h3><p>Correct queries are checked against the fictional dataset. Submitted explanations are saved, not assessed by a real lecturer. Work completed with in-app assistance is marked; use of outside tools cannot be detected.</p></section></div><section class="card minicard" style="margin-top:13px"><h3>About Domain Bridge</h3><p>Domain Bridge is a proposed AI-supported Cross-Domain Learning and Skill Integration Service. This locally runnable prototype illustrates student-facing behavior and does not constitute a production FHNW service, real generative AI integration, employment assessment, or university credential.</p></section>`}
function render(){let c={Dashboard:dashboard,'My Capability Journey':journey,'Learning Bridge':learningBridge,Workbench:workbench,'Competency Evidence':evidence,'Practice Lab':practiceLab,Settings:settings}[state.screen]||dashboard;shell(c());}
function navigate(dest){state.screen=dest;if(dest==='Learning Bridge')state.bridgeVisited=true;persist();render();window.scrollTo({top:0,behavior:'instant'})}
function modal(inner,buttons){portal.innerHTML=`<div class="overlay" id="overlay"><div class="modal card" role="dialog" aria-modal="true" aria-label="Dialog">${inner}<div class="modal-actions">${buttons.map(x=>`<button class="btn ${x.primary?'primary':''}" data-action="${x.action}" ${x.value?'data-value="'+esc(x.value)+'"':''}>${x.label}</button>`).join('')}</div></div></div>`}
function exportFile(name,content,type){const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportEvidence(){const d={disclaimer:'DEMONSTRATION RECORD. This is not an official FHNW competency assessment.',student:'Sameh Mathew (fictional persona)',career_interest:state.career,academic_context:'MSc BIS, Autumn 2026; curriculum inputs simulated',learning_bridge_mapping_used:state.mapped,sql_workbench:{query:state.sql,query_ran:state.workRun,correct_sample_output:state.workOk,in_app_assistance_levels:state.hintLevels,independent_mastery_established:false,external_assistance_unknown:true,explanation_submitted:state.explanationSubmitted,student_explanation:state.explanation,transfer_example_correct:state.transferDone},practice_lab:{simulated:true,completed:state.simulationDone,completed_phases:state.labCompleted,discovery_notes:state.discoveryNotes,data_findings:state.dataFindings,recommendation:{cause:state.recCause,correction:state.recFix,control:state.recControl},presentation:state.presentation}};exportFile('domain-bridge-evidence-demo.json',JSON.stringify(d,null,2),'application/json;charset=utf-8')}
function portfolio(){const content=`# Domain Bridge | Simulated Technology Consulting Portfolio\n\n**SIMULATED EXPERIENCE — NOT REAL CLIENT WORK**\n\nStudent persona: Sameh Mathew\nRole practiced: Junior Technology Consultant\nFictional client: Alpine Retail Group\nEngagement: Retail Sales Reporting Transformation\n\n## Discovery notes\n${state.discoveryNotes}\n\n## Investigation notes\n${state.dataFindings}\n\n## Recommendation: cause\n${state.recCause}\n\n## Recommendation: correction\n${state.recFix}\n\n## Recommendation: preventive control\n${state.recControl}\n\n## Client presentation\n${state.presentation}\n\n## Evidence caveat\nThe activity was performed in an offline, scripted, fictional simulation. Submission is not verification of professional competence, independence, employment, or project experience.\n`;exportFile('domain-bridge-SIMULATED-consulting-portfolio.md',content,'text/markdown;charset=utf-8')}
function updateCodeView(){const t=document.getElementById('sql-editor'),under=document.getElementById('code-under'),ln=document.getElementById('linenos');if(!t||!under)return;if(t.value!==state.sql)t.value=state.sql;under.innerHTML=syntaxHighlight(t.value)+'\n';ln.textContent=Array.from({length:Math.max(7,t.value.split('\n').length)},(_,i)=>i+1).join('\n');under.scrollTop=t.scrollTop;under.scrollLeft=t.scrollLeft;ln.scrollTop=t.scrollTop}
function saveInputField(target){const f=target.dataset.field;if(!f)return;state[f]=target.value;persist();if(f==='sql'){if(state.workRun){state.workRun=false;state.workOk=false;state.workResults=null;state.workError='';persist()}updateCodeView()}}
function runQuery(){try{const out=evaluateSql(state.sql);state.workRun=true;state.workResults=out;state.workOk=out.expected&&out.correct;state.workError='';persist();render();toast(state.workOk?'Correct customer-level reporting totals produced.':'Query ran. Review the output for misattributed totals.')}catch(e){state.workError=e.message;state.workRun=false;state.workOk=false;state.workResults=null;persist();render();toast('Query could not be evaluated. See the editor message.')}}
function handleAction(action,value){switch(action){
case 'nav':navigate(value);break;
case 'select-cap':state.selectedCapability=value;persist();render();break;
case 'translate':state.mapped=!state.mapped;persist();render();break;
case 'consequence':state.businessConsequence=!state.businessConsequence;persist();render();break;
case 'bridge-help':state.bridgeHelp=value;persist();render();break;
case 'run-query':runQuery();break;
case 'reset-sql':state.sql=STARTER_SQL;state.workRun=false;state.workOk=false;state.workError='';state.workResults=null;persist();render();break;
case 'hint':{let n=Number(value);if(n===4){modal('<h2>Reveal a worked solution?</h2><p>This will replace the query with a correct worked example and clearly record Level 4 assistance. You can still edit and run it afterwards.</p>',[{label:'Cancel',action:'close-modal'},{label:'Reveal worked solution',action:'confirm-solution',primary:true}]);break;}if(!state.hintLevels.includes(n))state.hintLevels.push(n);state.hintLevels.sort((a,b)=>a-b);persist();render();break;}
case 'confirm-solution':state.hintLevels=[...new Set([...state.hintLevels,4])].sort((a,b)=>a-b);state.sql=CORRECT_SQL;state.workRun=false;state.workOk=false;state.workError='';state.workResults=null;portal.innerHTML='';persist();render();toast('Worked query inserted; assistance recorded. Run to verify the result.');break;
case 'save-explanation':{let box=document.getElementById('work-explanation');if(box)state.explanation=box.value;if(state.explanation.trim().length<25){toast('Please write at least a brief explanation before saving.');return;}state.explanationSubmitted=true;persist();render();toast('Explanation saved. Submission is not an automatic correctness judgement.');break;}
case 'check-transfer':if(state.transferChoice==='id'){state.transferDone=true;persist();render();toast('Correct relation. Transfer evidence recorded for this single new example.')}else toast('That relationship can be ambiguous. Look for a shared unique identifier.');break;
case 'why':showEvidenceModal(value);break;
case 'export-evidence':exportEvidence();toast('Local evidence exported as JSON.');break;
case 'start-discovery':state.discoveryStarted=true;persist();render();document.getElementById('chat-input')?.focus();toast('Discovery opened. Ask Anna about the reporting requirements.');break;
case 'lab-phase':{let n=Number(value);if(n>0&&!stageDone(n-1)){toast('Complete the previous project phase before moving forward.');return;}state.labPhase=n;persist();render();break;}
case 'send-chat':{let box=document.getElementById('chat-input');let q=(box?.value||state.chatDraft).trim();if(!q){toast('Enter a discovery question to ask the simulated stakeholder.');return;}state.chat.push({by:'Sameh',text:q},{by:'Anna Keller',text:chatRespond(q)});state.chatDraft='';persist();render();let log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight;break;}
case 'save-discovery':if(!state.chat.filter(m=>m.by==='Sameh').length){toast('Ask Anna at least one question before completing discovery.');return;}if(state.discoveryNotes.trim().length<20){toast('Add some discovery notes to complete this phase.');return;}if(!stageDone(0))state.labCompleted.push(0);state.labPhase=1;persist();render();toast('Discovery notes saved. Continue to data investigation.');break;
case 'save-data':if(state.dataFindings.trim().length<30){toast('Write a short root-cause finding first.');return;}if(!stageDone(1))state.labCompleted.push(1);state.labPhase=2;persist();render();toast('Investigation notes saved.');break;
case 'save-rec':if([state.recCause,state.recFix,state.recControl].some(x=>x.trim().length<15)){toast('Include a cause, correction, and prevention control.');return;}if(!stageDone(2))state.labCompleted.push(2);state.labPhase=3;persist();render();toast('Recommendation saved. Prepare the client presentation.');break;
case 'complete-lab':if(state.presentation.trim().length<40){toast('Write a client-facing explanation before completing the simulation.');return;}if(!stageDone(3))state.labCompleted.push(3);state.simulationDone=true;persist();render();toast('Simulated engagement completed. Portfolio export is available.');break;
case 'lab-help':state.labHelp=value;persist();render();break;
case 'portfolio':portfolio();toast('Simulated portfolio exported with a clear disclosure.');break;
case 'lab-reset':modal('<h2>Reset Practice Lab?</h2><p>This removes only the local simulated engagement notes, responses and completion statuses. The Learning Bridge and Workbench remain untouched.</p>',[{label:'Cancel',action:'close-modal'},{label:'Reset simulation',action:'confirm-lab-reset',primary:true}]);break;
case 'confirm-lab-reset':{let d=defaults();for(let k of ['labPhase','discoveryStarted','labCompleted','chat','chatDraft','discoveryNotes','dataFindings','recCause','recFix','recControl','presentation','simulationDone','labHelp'])state[k]=d[k];portal.innerHTML='';persist();render();toast('Practice Lab reset.');break;}
case 'reset-all':modal('<h2>Reset all prototype activity?</h2><p>This clears the local learning record, simulation deliverables, hint history and career preference. It does not affect university systems.</p>',[{label:'Cancel',action:'close-modal'},{label:'Reset demo',action:'confirm-reset-all',primary:true}]);break;
case 'confirm-reset-all':state=defaults();portal.innerHTML='';persist();render();toast('Prototype returned to its initial demo state.');break;
case 'close-modal':portal.innerHTML='';break;
}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button){handleAction(button.dataset.action,button.dataset.value)}});
document.addEventListener('input',e=>{const input=e.target.closest('[data-field]');if(input)saveInputField(input)});
document.addEventListener('change',e=>{if(e.target.name==='transfer'){state.transferChoice=e.target.value;persist()}if(e.target.id==='career-select'){state.career=e.target.value;persist();render();toast('Career interest updated as your preference.')}});
document.addEventListener('scroll',e=>{if(e.target.id==='sql-editor'){const under=document.getElementById('code-under'),nums=document.getElementById('linenos');if(under){under.scrollTop=e.target.scrollTop;under.scrollLeft=e.target.scrollLeft}if(nums)nums.scrollTop=e.target.scrollTop}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&portal.innerHTML){portal.innerHTML=''}if(e.target.id==='sql-editor'&&e.key==='Tab'){e.preventDefault();let el=e.target,s=el.selectionStart,end=el.selectionEnd;el.value=el.value.slice(0,s)+'    '+el.value.slice(end);el.selectionStart=el.selectionEnd=s+4;state.sql=el.value;persist();updateCodeView()}});
window.addEventListener('resize',()=>{if(state.screen==='My Capability Journey')drawConnections()});
render();
})();
</script>
</body>
</html>
